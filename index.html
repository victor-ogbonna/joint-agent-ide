<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <!-- Makes the site installable as an app ("Install app" in Chrome). Opened
         from its icon it runs fullscreen with no browser bar. -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Title leads with the job, not the brand: nobody searches "Joint-Agent",
         they search for the problem. Kept under ~60 chars so Google does not
         truncate it in results. -->
    <title>Joint-Agent IDE — AI that writes, compiles and flashes firmware</title>
    <meta name="description" content="Describe your project in plain English. Joint-Agent IDE autonomously writes the code, compiles it in the cloud and flashes it straight to your ESP32 or Arduino — in a browser tab on a computer or an Android phone, with nothing to install." />
    <meta name="keywords" content="AI embedded development, ESP32 online IDE, Arduino online compiler, browser firmware flashing, cloud firmware compiler, AI firmware generator, embedded systems AI agent, web serial flashing" />
    <link rel="canonical" href="https://jointagentide.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B0D12" />

    <!-- Open Graph: controls the preview card on WhatsApp, LinkedIn, Slack and
         Facebook. Without these a shared link shows a bare URL, which is what
         was happening every time the waitlist link was posted. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jointagentide.com/" />
    <meta property="og:site_name" content="Joint-Agent IDE" />
    <meta property="og:title" content="Describe it. It compiles. It flashes." />
    <meta property="og:description" content="An AI agent that autonomously writes, compiles and flashes embedded firmware from a browser tab. 466 boards. Nothing to install." />
    <meta property="og:image" content="https://jointagentide.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An Arduino wired to a breadboard with a lit LED, beside the Joint-Agent IDE logo." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Describe it. It compiles. It flashes." />
    <meta name="twitter:description" content="An AI agent that autonomously writes, compiles and flashes embedded firmware from a browser tab. 466 boards. Nothing to install." />
    <meta name="twitter:image" content="https://jointagentide.com/og-image.jpg" />

    <!-- Structured data. Lets Google show this as a software product with a
         price rather than a plain blue link. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Joint-Agent IDE",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web browser",
      "url": "https://jointagentide.com/",
      "description": "An AI agent that autonomously writes, compiles and flashes embedded firmware from a browser tab, with nothing to install.",
      "featureList": [
        "Generates board-specific C++ from a plain English description",
        "Compiles real firmware in the cloud",
        "Flashes to ESP32 and Arduino over Web Serial, and from Android phones over WebUSB",
        "Auto-generated circuit schematics",
        "466 supported boards"
      ],
      "offers": {
        "@type": "Offer",
        "price": "7",
        "priceCurrency": "USD",
        "description": "Pro — 10x more AI every 5 hours, auto-debug and unlimited compiles"
      },
      "author": {
        "@type": "Organization",
        "name": "Ogbontor Engineering Enterprise"
      }
    }
    </script>
    <!-- Fonts and the maths styles (KaTeX) load alongside the page instead of
         holding it up: media="print" doesn't block drawing the page, and onload
         switches them on once they arrive. The fonts swap in by themselves
         (display=swap); maths only appears in agent replies, later. Paystack's
         checkout script loads once the page is up (src/lib/paystackScript.ts). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" media="print" onload="this.media='all'" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" />
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <!-- A browser too old to run the app (Internet Explorer, old Edge, Chrome
         before 80) would show a blank page: say what to do instead. Plain ES5,
         so it runs there. Every browser the app supports passes both checks. -->
    <script>
      (function () {
        var ok = "noModule" in document.createElement("script");
        try { new Function("var a = {}; return a?.b ?? 1;")(); } catch (e) { ok = false; }
        if (ok) return;
        var root = document.getElementById("root");
        if (!root) return;
        document.body.style.background = "#0B0D12";
        root.innerHTML =
          '<div style="max-width:520px;margin:15vh auto 0;padding:24px;font-family:Arial,sans-serif;color:#f1f5f9;background:#11141b;border:1px solid #2a2f3a;border-radius:12px;line-height:1.5">' +
          '<h1 style="font-size:20px;margin:0 0 12px">Please update your browser</h1>' +
          '<p style="margin:0 0 10px">Joint-Agent IDE needs a newer browser than this one.</p>' +
          '<p style="margin:0">Update Google Chrome (menu, then Help, then About Google Chrome), or open this page in the latest Chrome, Microsoft Edge or Firefox. On Windows 7 or 8, Chrome 109 works.</p>' +
          "</div>";
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
