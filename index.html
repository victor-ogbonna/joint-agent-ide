<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Title leads with the job, not the brand: nobody searches "Joint-Agent",
         they search for the problem. Kept under ~60 chars so Google does not
         truncate it in results. -->
    <title>Joint-Agent IDE — AI that writes, compiles and flashes firmware</title>
    <meta name="description" content="Describe your project in plain English. Joint-Agent IDE writes the code, compiles it on a real PlatformIO toolchain and flashes it straight to your ESP32 or Arduino — in a browser tab, with nothing to install." />
    <meta name="keywords" content="AI embedded development, ESP32 online IDE, Arduino online compiler, browser firmware flashing, PlatformIO cloud, AI firmware generator, embedded systems AI agent, web serial flashing" />
    <link rel="canonical" href="https://jointagentide.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0B0D12" />

    <!-- Open Graph: controls the preview card on WhatsApp, LinkedIn, Slack and
         Facebook. Without these a shared link shows a bare URL, which is what
         was happening every time the waitlist link was posted. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jointagentide.com/" />
    <meta property="og:site_name" content="Joint-Agent IDE" />
    <meta property="og:title" content="Describe it. It compiles. It flashes." />
    <meta property="og:description" content="An AI agent that writes, compiles and flashes embedded firmware from a browser tab. 466 boards. Nothing to install." />
    <meta property="og:image" content="https://jointagentide.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="An Arduino wired to a breadboard with a lit LED, beside the Joint-Agent IDE logo." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Describe it. It compiles. It flashes." />
    <meta name="twitter:description" content="An AI agent that writes, compiles and flashes embedded firmware from a browser tab. 466 boards. Nothing to install." />
    <meta name="twitter:image" content="https://jointagentide.com/og-image.jpg" />

    <!-- Structured data. Lets Google show this as a software product with a
         price rather than a plain blue link. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Joint-Agent IDE",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Web browser",
      "url": "https://jointagentide.com/",
      "description": "An AI agent that writes, compiles and flashes embedded firmware from a browser tab, with nothing to install.",
      "featureList": [
        "Generates board-specific C++ from a plain English description",
        "Compiles on a real PlatformIO toolchain in the cloud",
        "Flashes to ESP32 and Arduino over Web Serial",
        "Auto-generated circuit schematics",
        "466 supported boards"
      ],
      "offers": {
        "@type": "Offer",
        "price": "7",
        "priceCurrency": "USD",
        "description": "Pro — 400,000 tokens per month"
      },
      "author": {
        "@type": "Organization",
        "name": "Ogbontor Engineering Enterprise"
      }
    }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
    <script src="https://js.paystack.co/v1/inline.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
